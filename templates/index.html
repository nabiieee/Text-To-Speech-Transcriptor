<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Speech-to-Text Demo (Whisper)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitcount+Prop+Single:wght@100..900&family=Noto+Serif:ital,wght@0,100..900;1,100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">

</head>
<body>
  <div class="card">
    <h1>🎙️ Speech-to-Text Transcription</h1>
    <p class="subtitle">Don't type, just speak...it so easy!</p>

    <button id="recordBtn">Start Recording</button>
    <p id="status" class="status"></p>

    <label for="transcript">Transcript</label>
    <textarea id="transcript" rows="8" readonly placeholder="Your transcribed speech will appear here..."></textarea>

    <button id="clearBtn" class="secondary">Clear</button>
  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
